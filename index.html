<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퇴고할게여 — 신나는애프터센터 글쓰기동아리 신작클럽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9E3D3;
    --paper-deep:#DFD8C4;
    --card:#FBF7EC;
    --line:#C7784F;      /* 원고지 격자선 톤 */
    --line-faint:#D8B79C;
    --ink:#242220;
    --ink-soft:#5B564C;
    --seal:#AE3A2C;       /* 낙관 인주 색 */
    --seal-dark:#8C2C21;
    --jade:#3F6C5E;       /* 청자색 보조 */
    --jade-soft:#E4EEE9;
    --gold:#B08B3C;
    --radius:2px;
    --mission-ink:#284A40;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1E1D1A; --paper-deep:#2A2824; --card:#262420;
      --line:#8A5A40; --line-faint:#4A4237;
      --ink:#EDE7D8; --ink-soft:#B3AB9A;
      --seal:#D0604F; --seal-dark:#A94536;
      --jade:#7FB3A2; --jade-soft:#243530; --mission-ink:#BFDDD2;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1E1D1A; --paper-deep:#2A2824; --card:#262420;
    --line:#8A5A40; --line-faint:#4A4237;
    --ink:#EDE7D8; --ink-soft:#B3AB9A;
    --seal:#D0604F; --seal-dark:#A94536;
    --jade:#7FB3A2; --jade-soft:#243530; --mission-ink:#BFDDD2;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    background:
      repeating-linear-gradient(var(--paper) 0 27px, var(--line-faint) 27px 28px),
      repeating-linear-gradient(90deg, var(--paper) 0 27px, var(--line-faint) 27px 28px),
      var(--paper);
    background-blend-mode:multiply, multiply, normal;
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 80px;
  }

  .stage{
    width:100%;
    max-width:720px;
  }

  .frame{
    background:var(--card);
    border:1px solid var(--line);
    box-shadow: 0 1px 0 var(--line), 0 20px 40px -28px rgba(36,34,32,0.45);
    position:relative;
    padding:40px 36px 36px;
  }
  .frame::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid var(--line-faint);
    pointer-events:none;
  }

  .kicker{
    font-family:'Gaegu', cursive;
    color:var(--jade);
    font-size:15px;
    letter-spacing:.02em;
    margin:0 0 6px;
  }
  h1{
    font-family:'Gaegu', cursive;
    font-weight:700;
    font-size:clamp(28px, 5vw, 40px);
    line-height:1.35;
    margin:0 0 14px;
    color:var(--seal);
  }
  .lede{
    font-size:15px;
    line-height:1.8;
    color:var(--ink-soft);
    margin:0 0 28px;
    max-width:52ch;
  }

  /* ---------- 시작 화면 ---------- */
  .grid-preview{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    gap:1px;
    background:var(--line-faint);
    border:1px solid var(--line-faint);
    margin:0 0 30px;
    max-width:360px;
  }
  .grid-preview span{
    background:var(--card);
    aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;
    font-family:'Song Myung', serif;
    font-size:14px;
    color:var(--line-faint);
  }
  .grid-preview span.on{ color:var(--seal); }

  button.primary{
    appearance:none;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:14px 26px;
    cursor:pointer;
    letter-spacing:.02em;
    transition:transform .15s ease, background .15s ease;
  }
  button.primary:hover{ background:var(--seal); border-color:var(--seal); }
  button.primary:active{ transform:translateY(1px); }
  button.primary:focus-visible, button.choice:focus-visible, button.ghost:focus-visible{
    outline:3px solid var(--jade); outline-offset:2px;
  }

  .meta-line{
    margin-top:22px;
    font-size:13px;
    color:var(--ink-soft);
    display:flex; gap:18px; flex-wrap:wrap;
  }
  .meta-line b{ color:var(--ink); }

  /* ---------- 진행 표시 (원고지 칸) ---------- */
  .progress{
    display:flex;
    gap:4px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .progress i{
    width:20px; height:20px;
    border:1px solid var(--line);
    display:block;
    font-style:normal;
  }
  .progress i.filled{ background:var(--seal); border-color:var(--seal-dark); }
  .progress i.current{ background:var(--jade-soft); border-color:var(--jade); }

  .q-eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    color:var(--jade);
    font-weight:700;
    margin:0 0 10px;
  }
  .q-text{
    font-family:'Gowun Batang', serif;
    font-size:clamp(19px, 3vw, 23px);
    line-height:1.6;
    margin:0 0 24px;
  }

  .choices{ display:flex; flex-direction:column; gap:12px; }
  button.choice{
    text-align:left;
    background:var(--paper);
    border:1px solid var(--line-faint);
    padding:16px 18px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    gap:14px;
    align-items:flex-start;
    transition:background .12s ease, border-color .12s ease, transform .08s ease;
  }
  button.choice .tag{
    flex:0 0 auto;
    font-family:'Song Myung', serif;
    font-size:13px;
    color:var(--seal);
    border:1px solid var(--seal);
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  button.choice:hover{ background:var(--card); border-color:var(--seal); }
  button.choice:active{ transform:translateY(1px); }

  .q-footer{
    margin-top:22px;
    display:flex; justify-content:space-between; align-items:center;
  }
  button.ghost{
    background:none;border:none;
    color:var(--ink-soft);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }

  /* ---------- 결과 화면 ---------- */
  .result-top{
    display:flex;
    gap:26px;
    align-items:center;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .seal-wrap{
    width:120px;height:120px;
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .seal{
    width:112px;height:112px;
    border:3px solid var(--seal);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:var(--seal);
    font-family:'Song Myung', serif;
    font-size:30px;
    letter-spacing:.03em;
    transform:scale(0) rotate(-14deg);
    opacity:0;
    background:transparent;
    animation:stamp .55s cubic-bezier(.2,1.4,.4,1) .15s forwards;
  }
  @keyframes stamp{
    0%{ transform:scale(2.6) rotate(-14deg); opacity:0; }
    55%{ opacity:1; }
    75%{ transform:scale(0.92) rotate(-14deg); }
    100%{ transform:scale(1) rotate(-14deg); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .seal{ animation:none; transform:scale(1) rotate(-14deg); opacity:1; }
  }

  .result-head .kicker{ margin-bottom:4px; }
  .type-code{ font-size:13px; letter-spacing:.18em; color:var(--ink-soft); font-weight:700; }
  h2.type-name{
    font-family:'Song Myung', serif;
    font-weight:400;
    font-size:clamp(24px,4vw,30px);
    margin:2px 0 10px;
  }
  .type-desc{
    font-size:14.5px; line-height:1.8; color:var(--ink-soft); margin:0;
    max-width:56ch;
  }

  .section-label{
    font-size:12px; letter-spacing:.14em; color:var(--jade); font-weight:700;
    margin:30px 0 12px;
    display:flex; align-items:center; gap:10px;
  }
  .section-label::after{
    content:""; flex:1; height:1px; background:var(--line-faint);
  }

  .book-card{
    border:1px solid var(--line-faint);
    background:var(--paper);
    padding:16px 18px;
    margin-bottom:12px;
    position:relative;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:4px 16px;
  }
  .book-card::before{
    content:"";
    position:absolute; left:0; top:14px; bottom:14px; width:3px;
    background:var(--jade);
  }
  .book-card .punch{
    width:10px; height:10px; border-radius:50%;
    background:var(--paper-deep);
    border:1px solid var(--line-faint);
    grid-row:span 3;
    align-self:start;
    margin-top:4px;
  }
  .book-title{ font-family:'Gowun Batang', serif; font-size:16.5px; font-weight:700; }
  .book-meta{ font-size:12px; color:var(--ink-soft); letter-spacing:.02em; }
  .book-meta .badge{
    display:inline-block; padding:1px 7px; border:1px solid var(--jade);
    color:var(--jade); border-radius:999px; font-size:11px; margin-right:6px;
  }
  .book-blurb{ font-size:13.5px; line-height:1.65; color:var(--ink); margin-top:4px; }

  .mission{
    background:var(--jade-soft);
    border:1px dashed var(--jade);
    padding:16px 18px;
    font-family:'Gaegu', cursive;
    font-size:16px;
    line-height:1.7;
    color:var(--mission-ink);
    margin-top:8px;
  }
  .mission b{ color:var(--seal); }

  .result-actions{
    margin-top:30px;
    display:flex; gap:12px; flex-wrap:wrap;
  }

  footer.note{
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
    margin-top:18px;
  }

  [hidden]{ display:none !important; }

  @media (max-width:520px){
    .frame{ padding:28px 18px 26px; }
    .progress i{ width:16px; height:16px; }
    .book-card{ grid-template-columns:1fr; }
    .book-card .punch{ display:none; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- ============ 1. 시작 화면 ============ -->
  <section class="frame" id="screen-intro">
    <p class="kicker">신나는애프터센터 글쓰기동아리 신작클럽이 준비했어</p>
    <h1>퇴고할게여</h1>
    <p class="lede">
      열두 개의 짧은 질문에 답하면, 16가지 성격유형 중 네 유형을 찾고
      그 유형에 잘 어울리는 책 두 권이랑 오늘 가볍게 해볼 만한 작은 미션도 알려줄게.
      정답은 없으니까, 평소 네 모습에 더 가까운 쪽으로 골라줘!
    </p>

    <div class="grid-preview" id="gridPreview" aria-hidden="true"></div>

    <button class="primary" id="startBtn">원고지 첫 칸부터 시작하기 →</button>

    <div class="meta-line">
      <span><b>12</b>개의 질문</span>
      <span>약 <b>3분</b> 소요</span>
      <span><b>16</b>가지 유형 × 책 2권씩</span>
    </div>
  </section>

  <!-- ============ 2. 질문 화면 ============ -->
  <section class="frame" id="screen-quiz" hidden>
    <div class="progress" id="progress"></div>
    <p class="q-eyebrow" id="qEyebrow">QUESTION</p>
    <p class="q-text" id="qText"></p>
    <div class="choices" id="qChoices"></div>
    <div class="q-footer">
      <button class="ghost" id="backBtn">← 이전 질문</button>
      <span style="font-size:12px;color:var(--ink-soft);" id="qCounter"></span>
    </div>
  </section>

  <!-- ============ 3. 결과 화면 ============ -->
  <section class="frame" id="screen-result" hidden>
    <div class="result-top">
      <div class="seal-wrap"><div class="seal" id="sealCode"></div></div>
      <div class="result-head">
        <p class="kicker">너의 책 유형은</p>
        <p class="type-code" id="typeCode"></p>
        <h2 class="type-name" id="typeName"></h2>
      </div>
    </div>
    <p class="type-desc" id="typeDesc"></p>

    <p class="section-label">이 유형한테 건네주고 싶은 책 두 권</p>
    <div id="bookList"></div>

    <p class="section-label">오늘의 미니 미션</p>
    <div class="mission" id="mission"></div>

    <div class="result-actions">
      <button class="primary" id="restartBtn">처음부터 다시 하기</button>
    </div>
    <footer class="note">친구들이랑 결과 비교해보고, 신나는애프터센터 글쓰기동아리 신작클럽에도 놀러 와!</footer>
  </section>

</div>

<script>
(function(){

  // ---------------- 데이터 ----------------
  var QUESTIONS = [
    // E / I
    {axis:"EI", text:"쉬는 시간에 나는…",
     a:{t:"친구들이랑 왁자지껄 떠들면서 에너지를 얻는다", v:"E"},
     b:{t:"이어폰 끼고 혼자 조용히 시간을 보낸다", v:"I"}},
    {axis:"EI", text:"낯선 사람이 많은 자리에 가면 나는…",
     a:{t:"먼저 다가가서 말을 붙이는 편이다", v:"E"},
     b:{t:"분위기를 살피며 천천히 적응하는 편이다", v:"I"}},
    {axis:"EI", text:"스트레스를 풀고 싶을 때 나는…",
     a:{t:"친구들을 불러 모아서 같이 논다", v:"E"},
     b:{t:"혼자만의 시간을 갖는다", v:"I"}},

    // S / N
    {axis:"SN", text:"새로운 걸 배울 때 나는…",
     a:{t:"순서대로 차근차근 익히는 게 편하다", v:"S"},
     b:{t:"큰 흐름부터 파악하고 감으로 이해하는 게 편하다", v:"N"}},
    {axis:"SN", text:"영화나 드라마를 볼 때 더 끌리는 건…",
     a:{t:"실제로 있을 법한 현실적인 이야기", v:"S"},
     b:{t:"상상력 가득한 판타지나 낯선 세계관", v:"N"}},
    {axis:"SN", text:"계획을 세울 때 나는…",
     a:{t:"지금 당장 할 수 있는 것부터 생각한다", v:"S"},
     b:{t:"나중에 어떻게 될지 가능성부터 상상한다", v:"N"}},

    // T / F
    {axis:"TF", text:"친구가 고민을 털어놓으면 나는…",
     a:{t:"어떻게 해결할지 같이 방법을 찾아준다", v:"T"},
     b:{t:"일단 마음이 어땠을지 공감부터 해준다", v:"F"}},
    {axis:"TF", text:"친구랑 다툼이 생겼을 때 나는…",
     a:{t:"누가 맞고 틀렸는지 논리적으로 따져본다", v:"T"},
     b:{t:"서로 감정이 상하지 않게 조율하려 한다", v:"F"}},
    {axis:"TF", text:"중요한 결정을 내릴 때 나는…",
     a:{t:"기준과 이유가 명확한 쪽을 고른다", v:"T"},
     b:{t:"마음이 끌리는 쪽을 고른다", v:"F"}},

    // J / P
    {axis:"JP", text:"여행이나 나들이를 갈 때 나는…",
     a:{t:"일정을 미리 짜두는 걸 좋아한다", v:"J"},
     b:{t:"그때그때 발길 닿는 대로 다니는 걸 좋아한다", v:"P"}},
    {axis:"JP", text:"시험 기간에 나는…",
     a:{t:"계획표를 세우고 그대로 지키려 한다", v:"J"},
     b:{t:"벼락치기로 몰아서 하는 편이다", v:"P"}},
    {axis:"JP", text:"방을 정리할 때 나는…",
     a:{t:"물건마다 자리를 정해서 규칙적으로 정리한다", v:"J"},
     b:{t:"필요할 때만 정리하고 평소엔 편한 대로 둔다", v:"P"}}
  ];

  var TYPES = {
    ISTJ:{ name:"한 문장도 허투루 쓰지 않는 기록자",
      desc:"사실과 구조를 신뢰하고, 정해진 원칙 안에서 문장을 꾸준히 다듬어가는 유형이야.",
      books:[
        {title:"파운데이션", author:"아이작 아시모프", country:"해외", genre:"SF소설", blurb:"은하 제국의 몰락과 재건을 수학적 예측으로 그려낸 대작 SF 시리즈의 시작. 치밀한 설계와 논리를 좋아하는 사람에게 잘 맞아."},
        {title:"동물농장", author:"조지 오웰", country:"해외", genre:"소설", blurb:"농장을 배경으로 권력이 작동하는 방식을 냉정하게 풀어낸 우화 소설이야."}
      ],
      mission:"오늘 있었던 일 중 가장 <b>사실적인 장면</b> 하나를 감정 없이, 사실만으로 다섯 문장으로 기록해봐!"},
    ISFJ:{ name:"묵묵히 곁을 지키는 이야기꾼",
      desc:"주변 사람과 일상의 온기를 세심하게 관찰하고 정성껏 기록하는 유형이야.",
      books:[
        {title:"앵무새 죽이기", author:"하퍼 리", country:"해외", genre:"장편소설", blurb:"한 소녀의 눈으로 바라본 편견과 정의에 관한 이야기를 담담하게 풀어낸 미국 문학의 고전이야."},
        {title:"남아 있는 나날", author:"가즈오 이시구로", country:"해외", genre:"장편소설", blurb:"평생을 성실하게 일해 온 집사가 지나온 시간을 돌아보며 자신의 선택을 되짚는 소설이야."}
      ],
      mission:"동아리 친구 한 명을 떠올리며, 그 친구의 오늘 하루를 <b>다정한 시선</b>으로 짧게 묘사해봐!"},
    INFJ:{ name:"세상의 결을 읽는 통찰가",
      desc:"사람과 세상을 깊이 들여다보고, 그 안의 의미를 찾아 글로 옮기는 유형이야.",

      ],
      mission:"이야기 속 리더 캐릭터가 조직을 설득하는 <b>짧은 연설문</b>을 써봐!"}

  // ---------------- 상태 ----------------
  var current = 0;
  var answers = new Array(QUESTIONS.length).fill(null);

  var introScreen = document.getElementById('screen-intro');
  var quizScreen = document.getElementById('screen-quiz');
  var resultScreen = document.getElementById('screen-result');

  // 시작 화면 미니 원고지 프리뷰
  (function initPreview(){
    var wrap = document.getElementById('gridPreview');
    for(var i=0;i<30;i++){
      var s = document.createElement('span');
      if([2,7,13,18,24].indexOf(i)>-1){ s.textContent='文'; s.className='on'; }
      wrap.appendChild(s);
    }
  })();

  document.getElementById('startBtn').addEventListener('click', function(){
    introScreen.hidden = true;
    quizScreen.hidden = false;
    renderQuestion();
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    if(current>0){ current--; renderQuestion(); }
  });

  document.getElementById('restartBtn').addEventListener('click', function(){
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    resultScreen.hidden = true;
    introScreen.hidden = false;
  });

  function renderProgress(){
    var el = document.getElementById('progress');
    el.innerHTML = '';
    for(var i=0;i<QUESTIONS.length;i++){
      var i_ = document.createElement('i');
      if(answers[i]) i_.className='filled';
      else if(i===current) i_.className='current';
      el.appendChild(i_);
    }
  }

  function renderQuestion(){
    renderProgress();
    var q = QUESTIONS[current];
    document.getElementById('qEyebrow').textContent = 'QUESTION ' + (current+1) + ' / ' + QUESTIONS.length;
    document.getElementById('qCounter').textContent = (current+1) + ' / ' + QUESTIONS.length;
    document.getElementById('qText').textContent = q.text;
    document.getElementById('backBtn').style.visibility = current===0 ? 'hidden' : 'visible';

    var box = document.getElementById('qChoices');
    box.innerHTML = '';
    [q.a, q.b].forEach(function(opt, idx){
      var b = document.createElement('button');
      b.className = 'choice';
      b.innerHTML = '<span class="tag">' + (idx===0?'가':'나') + '</span><span>' + opt.t + '</span>';
      b.addEventListener('click', function(){
        answers[current] = opt.v;
        if(current < QUESTIONS.length-1){
          current++;
          renderQuestion();
        } else {
          showResult();
        }
      });
      box.appendChild(b);
    });
  }

  function computeType(){
    var count = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    answers.forEach(function(v){ if(v) count[v]++; });
    var code =
      (count.E>=count.I ? 'E':'I') +
      (count.S>=count.N ? 'S':'N') +
      (count.T>=count.F ? 'T':'F') +
      (count.J>=count.P ? 'J':'P');
    return code;
  }

  function showResult(){
    quizScreen.hidden = true;
    resultScreen.hidden = false;

    var code = computeType();
    var data = TYPES[code];

    // 도장 애니메이션 재시작을 위해 요소 재생성
    var sealWrap = document.querySelector('.seal-wrap');
    sealWrap.innerHTML = '<div class="seal" id="sealCode">' + code + '</div>';

    document.getElementById('typeCode').textContent = code;
    document.getElementById('typeName').textContent = data.name;
    document.getElementById('typeDesc').textContent = data.desc;

    var list = document.getElementById('bookList');
    list.innerHTML = '';
    data.books.forEach(function(b){
      var card = document.createElement('div');
      card.className = 'book-card';
      card.innerHTML =
        '<span class="punch"></span>' +
        '<div>' +
          '<div class="book-title">' + b.title + '</div>' +
          '<div class="book-meta"><span class="badge">' + b.country + '</span><span class="badge">' + b.genre + '</span>' + b.author + '</div>' +
          '<div class="book-blurb">' + b.blurb + '</div>' +
        '</div>';
      list.appendChild(card);
    });

    document.getElementById('mission').innerHTML = data.mission;
    resultScreen.scrollIntoView({behavior:'smooth', block:'start'});
  }

})();
</script>
